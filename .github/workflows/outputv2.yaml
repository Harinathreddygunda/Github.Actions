name: outputv2-demo
on:
  workflow_dispatch
jobs:
  build:
    outputs:
      version: ${{ steps.step1.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: step1
        id: step1
        run: echo "version=0.0.v2" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: step2
        run: echo "The version is ${{ needs.build.outputs.version }}"
        
